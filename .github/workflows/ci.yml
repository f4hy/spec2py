name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so hatch-vcs can see tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pyright
        run: uv run pyright

      - name: Tests (including generated-client static gates)
        run: uv run pytest -q

  corpus:
    # Regenerates every real-world spec in corpus/manifest.toml and runs the
    # static gates on each client. Large specs (Stripe, GitHub) included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages
      - uses: actions/cache@v4
        with:
          path: corpus/specs
          key: corpus-${{ hashFiles('corpus/manifest.toml') }}
      - name: Corpus scorecard
        run: uv run corpus/run.py --gates
