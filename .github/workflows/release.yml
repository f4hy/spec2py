name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0 publishes spec2py and spec2py-runtime at 0.1.0

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    timeout-minutes: 15
    name: Build and smoke-test both distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so hatch-vcs can resolve the tag's version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Build both distributions
        run: uv build --all-packages

      - name: Smoke test installed wheels
        run: |
          uv venv /tmp/spec2py-release-smoke --python 3.14
          uv pip install --python /tmp/spec2py-release-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/spec2py-release-smoke/bin/spec2py --help
          /tmp/spec2py-release-smoke/bin/python -c "import spec2py, spec2py_runtime"
          /tmp/spec2py-release-smoke/bin/spec2py generate "$GITHUB_WORKSPACE/tests/specs/acme.yaml" -o /tmp/release-client --layout project
          uv pip install --python /tmp/spec2py-release-smoke/bin/python /tmp/release-client
          /tmp/spec2py-release-smoke/bin/python -c "from acme import Acme, AsyncAcme"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Each project publishes from its own job and environment. A PyPI trusted
  # publisher is matched on repository + workflow + environment, and a token
  # from a pending publisher can only create the one project it names; with
  # both projects on the same environment the token fits only one of them.
  # PyPI publishers: spec2py-runtime -> environment `pypi-runtime`,
  # spec2py -> environment `pypi`.
  publish-runtime:
    needs: build
    timeout-minutes: 10
    name: Publish spec2py-runtime to PyPI
    runs-on: ubuntu-latest
    environment: pypi-runtime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Publish spec2py-runtime
        run: uv publish dist/spec2py_runtime-*

  publish-generator:
    # After the runtime, which spec2py depends on.
    needs: publish-runtime
    timeout-minutes: 10
    name: Publish spec2py to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Publish spec2py
        run: uv publish dist/spec2py-*
