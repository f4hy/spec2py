# Real-world specs the generator is regression-tested against.
#
# Each spec is pinned by SHA-256. `uv run corpus/run.py` downloads missing specs
# into corpus/specs/ (gitignored), refuses any whose hash changed upstream (re-pin
# with --repin), generates a client for each, runs the static gates and prints
# the quality scorecard. The design target is 200+ specs; add entries freely.

