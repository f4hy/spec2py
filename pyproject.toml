[project]
name = "spec2py"
dynamic = ["version"]
description = "A Python-only OpenAPI client generator: Pydantic v2 models, an httpx2 runtime, sync and async from one source, with pagination, retries and streaming built in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Fahy", email = "bmfahy@gmail.com" }]
requires-python = ">=3.14"
keywords = ["openapi", "swagger", "codegen", "sdk", "client", "pydantic", "httpx", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "spec2py-runtime",
    "pyyaml>=6.0.2",
    "ruff>=0.15.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.120"]

[project.scripts]
spec2py = "spec2py.cli:main"

[project.urls]
Homepage = "https://github.com/f4hy/spec2py"
Issues = "https://github.com/f4hy/spec2py/issues"

[dependency-groups]
dev = [
    "fastapi>=0.140",
    "hypothesis>=6.150",
    "mypy>=2.0",
    "pyright>=1.1.410",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "python-multipart>=0.0.20",
    "ruff>=0.17",
    "ty>=0.0.80",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec2py"]

[tool.hatch.build.targets.sdist]
exclude = ["/corpus/specs", "/runtime"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/spec2py/_version.py"

[tool.uv.workspace]
members = ["runtime"]

[tool.uv.sources]
spec2py-runtime = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
markers = ["slow: generates and type-checks whole clients"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# pyright strict needs casts that mypy considers redundant after isinstance().
disable_error_code = ["redundant-cast"]
files = ["src", "runtime/src"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "opentelemetry.*", "ruff.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "runtime/src"]
pythonVersion = "3.14"
# The runtime ships into users' strict type checkers, so it is strict. The
# generator walks untyped JSON; it is mypy --strict clean and pyright standard.
typeCheckingMode = "standard"
strict = ["runtime/src"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "DTZ", "PTH", "PERF", "RET", "A", "PIE", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415",
    "E501",    # ruff format owns line length; long string literals are fine
    "PERF401", # explicit loops often read better than extend() or a comprehension
    "A005", # module names like `types`/`http` are deliberate
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["spec2py", "spec2py_runtime"]

[tool.ruff.lint.per-file-ignores]
# pydantic copies mutable defaults, and nested ``with`` reads better in tests
"tests/**" = ["PLR", "B011", "PLW", "RUF012", "SIM117"]
