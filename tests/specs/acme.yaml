openapi: 3.1.0
info:
  title: Acme API
  version: 2.4.0
  description: Billing, customers and AI completions for Acme Corp.
servers:
  - url: https://api.acme.test/v1
security:
  - bearerAuth: []
tags:
  - name: invoices
  - name: customers
  - name: completions
  - name: files
  - name: events
  - name: catalog
paths:
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      description: Returns invoices, newest first.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - name: customer_ids
          in: query
          description: Only invoices for these customers.
          schema:
            type: array
            items: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Invoice"}
                  next_cursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvoiceCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
        "422":
          description: Validation failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}
        default:
          $ref: "#/components/responses/Error"
  /invoices/{invoice_id}:
    parameters:
      - name: invoice_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Retrieve an invoice
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
        "404":
          description: Not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    patch:
      operationId: updateInvoice
      tags: [invoices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                memo:
                  type: [string, "null"]
                  description: Free-form note shown on the invoice. Send null to clear it.
                metadata:
                  $ref: "#/components/schemas/Metadata"
      responses:
        "200":
          description: The updated invoice.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      deprecated: true
      description: Use void instead.
      responses:
        "204":
          description: Deleted.
  /invoices/{invoice_id}/void:
    post:
      tags: [invoices]
      summary: Void an invoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The voided invoice.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invoice"}
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      parameters:
        - {name: offset, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}}
        - name: created_after
          in: query
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Customers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Customer"}
                  total: {type: integer}
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Customer"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
  /customers/{customer_id}/payment-methods:
    get:
      operationId: listCustomerPaymentMethods
      tags: [customers]
      parameters:
        - {name: customer_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: per_page, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Payment methods.
          headers:
            Link: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PaymentMethod"}
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      parameters:
        - {name: page, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Category trees.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/Category"}
                  total_pages: {type: integer}
  /catalog/search:
    post:
      operationId: searchCatalog
      tags: [catalog]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {$ref: "#/components/schemas/SearchFilter"}
      responses:
        "200":
          description: Matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: "#/components/schemas/Product"}
                    - {$ref: "#/components/schemas/Category"}
  /completions:
    post:
      operationId: createCompletion
      tags: [completions]
      summary: Stream a completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string}
                max_tokens: {type: integer}
                temperature: {type: number}
      responses:
        "200":
          description: Server-sent completion events.
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/CompletionEvent"
  /events/export:
    get:
      operationId: exportEvents
      tags: [events]
      responses:
        "200":
          description: Newline-delimited events.
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/Event"}
  /files:
    post:
      operationId: uploadFile
      tags: [files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: {type: string, format: binary}
                purpose: {type: string, enum: [invoice_attachment, logo]}
                tags:
                  type: array
                  items: {type: string}
      responses:
        "201":
          description: Uploaded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileObject"}
  /files/{file_id}/content:
    get:
      operationId: downloadFile
      tags: [files]
      parameters:
        - {name: file_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The file bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    InvoiceStatus:
      type: string
      enum: [draft, open, paid, void]
    Metadata:
      type: object
      additionalProperties: {type: string}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: integer, description: Amount in the smallest currency unit.}
        currency: {type: string, examples: [usd]}
    InvoiceCreate:
      type: object
      required: [customer_id, amount]
      properties:
        customer_id: {type: string}
        amount: {type: integer}
        currency: {type: string, default: usd}
        due_date: {type: string, format: date}
        memo: {type: string}
        metadata: {$ref: "#/components/schemas/Metadata"}
        line_items:
          type: array
          items:
            type: object
            required: [description, amount]
            properties:
              description: {type: string}
              amount: {type: integer}
              quantity: {type: integer, default: 1}
    Invoice:
      type: object
      required: [id, status, total, created_at]
      properties:
        id: {type: string, readOnly: true}
        status: {$ref: "#/components/schemas/InvoiceStatus"}
        total: {$ref: "#/components/schemas/Money"}
        customerId: {type: string}
        memo: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        metadata: {$ref: "#/components/schemas/Metadata"}
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
    Customer:
      type: object
      required: [id, email]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        email: {type: string, format: email}
        name: {type: string}
        class: {type: string, description: Customer tier (a Python keyword).}
        address: {$ref: "#/components/schemas/Address"}
    Address:
      type: object
      properties:
        line1: {type: string}
        city: {type: string}
        country: {type: string}
    PaymentMethodBase:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string}
        created_at: {type: string, format: date-time}
    Card:
      allOf:
        - $ref: "#/components/schemas/PaymentMethodBase"
        - type: object
          required: [last4]
          properties:
            last4: {type: string}
            brand: {type: string}
    BankAccount:
      allOf:
        - $ref: "#/components/schemas/PaymentMethodBase"
        - type: object
          properties:
            bank_name: {type: string}
            routing_number: {type: string}
    PaymentMethod:
      oneOf:
        - $ref: "#/components/schemas/Card"
        - $ref: "#/components/schemas/BankAccount"
      discriminator:
        propertyName: type
        mapping:
          card: "#/components/schemas/Card"
          bank_account: "#/components/schemas/BankAccount"
    Category:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        children:
          type: array
          items: {$ref: "#/components/schemas/Category"}
    Product:
      type: object
      required: [sku, price]
      properties:
        sku: {type: string}
        price: {$ref: "#/components/schemas/Money"}
        attributes: {}
    SearchFilter:
      type: object
      required: [field, value]
      properties:
        field: {type: string}
        op: {type: string, enum: [eq, lt, gt]}
        value:
          anyOf:
            - {type: string}
            - {type: number}
            - {type: boolean}
    CompletionEvent:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [delta, done]}
        text: {type: string}
    Event:
      type: object
      required: [id, kind]
      properties:
        id: {type: string}
        kind: {type: string}
        payload:
          type: object
          additionalProperties: true
    FileObject:
      type: object
      required: [id, bytes]
      properties:
        id: {type: string}
        bytes: {type: integer}
        filename: {type: string}
        purpose: {type: string}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code: {type: string}
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              problem: {type: string}
