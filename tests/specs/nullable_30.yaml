openapi: 3.0.3
info: {title: Notes, version: "1"}
servers: [{url: "https://{region}.notes.test/api", variables: {region: {default: eu}}}]
paths:
  /notes/{note_id}:
    get:
      operationId: getNote
      parameters:
        - {name: note_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
components:
  schemas:
    Note:
      type: object
      required: [id, body, archived_at]
      properties:
        id: {type: string}
        body: {type: string, nullable: true}
        archived_at: {type: string, format: date-time, nullable: true}
        color: {type: string, enum: [red, blue], nullable: true}
        author: {allOf: [{$ref: "#/components/schemas/Author"}], nullable: true}
        score: {type: number, minimum: 0, exclusiveMinimum: true}
    Author:
      type: object
      properties:
        name: {type: string}
